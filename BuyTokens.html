<!-- 
  BuyTokens.html
  Page for purchasing tokens. Current balance and price are 
  shown as placeholders since there's no backend logic yet.
-->
<!DOCTYPE html>
<html>
<head>
<title>Al's logistical Buy Tokens</title>

<style>
  body {
    margin: 0;
  }

  /* Same ribbon styling as Dashboard.html - kept identical across pages */
  .ribbon {
    display: flex;
    justify-content: center;
    gap: 20px;
    background-color: #ddd;
    border-bottom: 1px solid black;
    padding: 10px 0;
  }

  .ribbon div {
    cursor: pointer;
  }
</style>

</head>
<body>

<!-- Top navigation ribbon, same as all other pages -->
<div class="ribbon">
  <div>Create new route</div>
  <div>View Logs</div>
  <div>View Account</div>
  <div>View Tokens</div>
  <div>Toggle Light / Dark Mode</div>
  <div>Logout</div>
</div>

<!-- Main page content -->
<div style="padding: 20px;">
  <h2>Buy Tokens</h2>

  <table border="1">
    <tr>
      <!-- Displayed value, not an input - the user doesn't type their own balance -->
      <td>Current Balance</td>
      <td>placeholder</td>
    </tr>
    <tr>
      <td>Tokens to Buy</td>
      <!-- The one field the user actually enters a value into -->
      <td><input type="number" name="tokenAmount"></td>
    </tr>
    <tr>
      <!-- Also a displayed value, would update based on Tokens to Buy once logic is added -->
      <td>Price</td>
      <td>placeholder</td>
    </tr>
    <tr>
      <!-- type="button" - no logic to submit to yet -->
      <td colspan="2"><button type="button">Purchase</button></td>
    </tr>
  </table>
</div>

</body>
</html>
