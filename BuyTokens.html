<!DOCTYPE html>
<html>
<head>
<title>Al's logistical Buy Tokens</title>
<style>
body {
  margin: 0;
}

.ribbon {
  display: flex;
  justify-content: center;
  gap: 20px;
  background-color: #ddd;
  border-bottom: 1px solid black;
  padding: 10px 0;
}

.ribbon div {
  cursor: pointer;
}
</style>
</head>
<body>

<div class="ribbon">
  <div>Create new route</div>
  <div>View Logs</div>
  <div>View Account</div>
  <div>View Tokens</div>
  <div>Toggle Light / Dark Mode</div>
  <div>Logout</div>
</div>

<div style="padding: 20px;">
  <h2>Buy Tokens</h2>
  <table border="1">
    <tr>
      <td>Current Balance</td>
      <td>placeholder</td>
    </tr>
    <tr>
      <td>Tokens to Buy</td>
      <td><input type="number" name="tokenAmount"></td>
    </tr>
    <tr>
      <td>Price</td>
      <td>placeholder</td>
    </tr>
    <tr>
      <td colspan="2"><button type="button">Purchase</button></td>
    </tr>
  </table>
</div>

</body>
</html>
