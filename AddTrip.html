<!-- 
  AddTrip.html
  Form for logging a new trip. Fields match what the original 
  Python truck tracker script records (driver, truck ID, route, 
  min/max temp, start/finish time).
-->
<!DOCTYPE html>
<html>
<head>
<title>Al's logistical Add Trip</title>

<style>
  body {
    margin: 0;
  }

  /* Same ribbon styling as Dashboard.html - kept identical across pages */
  .ribbon {
    display: flex;
    justify-content: center;
    gap: 20px;
    background-color: #ddd;
    border-bottom: 1px solid black;
    padding: 10px 0;
  }

  .ribbon div {
    cursor: pointer;
  }
</style>

</head>
<body>

<!-- Top navigation ribbon, same as all other pages -->
<div class="ribbon">
  <div>Create new route</div>
  <div>View Logs</div>
  <div>View Account</div>
  <div>View Tokens</div>
  <div>Toggle Light / Dark Mode</div>
  <div>Logout</div>
</div>

<!-- Main page content -->
<div style="padding: 20px;">
  <h2>Add New Trip</h2>

  <form>
    <table border="1">
      <tr>
        <td>Driver Name</td>
        <td><input type="text" name="driver"></td>
      </tr>
      <tr>
        <td>Truck ID</td>
        <td><input type="text" name="truckId"></td>
      </tr>
      <tr>
        <td>Route</td>
        <td><input type="text" name="route"></td>
      </tr>
      <tr>
        <td>Min Temp</td>
        <!-- type="number" restricts input to numeric values -->
        <td><input type="number" name="minTemp"></td>
      </tr>
      <tr>
        <td>Max Temp</td>
        <td><input type="number" name="maxTemp"></td>
      </tr>
      <tr>
        <td>Start Time</td>
        <!-- type="time" gives a native time picker instead of free text -->
        <td><input type="time" name="startTime"></td>
      </tr>
      <tr>
        <td>Finish Time</td>
        <td><input type="time" name="finishTime"></td>
      </tr>
      <tr>
        <!-- 
          type="button" (not "submit") - this avoids triggering the 
          browser's default form-submission behavior, since there's 
          no logic wired up yet to handle the submitted data. 
        -->
        <td colspan="2"><button type="button">Submit Trip</button></td>
      </tr>
    </table>
  </form>
</div>

</body>
</html>
